[versions]
# agp/kotlin/composeCompiler: bewusst entfernt (v0.12.0-Aufräumen) — verwaiste
# Einträge; die echten Versionen leben hartcodiert im Root-build.gradle.kts
# Plugins-Block (AGP 8.9.1, Kotlin 2.0.21 — Compose-Compiler via plugin.compose).
ktor = "2.3.13"
coroutines = "1.7.3"
gson = "2.10.1"
junit = "4.13.2"
mockk = "1.13.10"
robolectric = "4.11.1"
composeBom = "2024.09.03"
healthConnect = "1.1.0"
lifecycle = "2.7.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
androidx-core = { module = "androidx.core:core", version = "1.12.0" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-gson = { module = "io.ktor:ktor-serialization-gson", version.ref = "ktor" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
